services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Password1!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Password1! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrations:
    build:
      context: ./src/EnsyInc.Loom
      dockerfile: Dockerfile
      target: migrations
    environment:
      Db__ConnectionString: "Server=db;Database=Loom;User Id=sa;Password=Password1!;TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./src/EnsyInc.Loom
      dockerfile: Dockerfile
      target: api
    environment:
      Db__ConnectionString: "Server=db;Database=Loom;User Id=sa;Password=Password1!;TrustServerCertificate=True;"
    ports:
      - "7088:7088"
      - "5029:5029"
    depends_on:
      migrations:
        condition: service_completed_successfully
